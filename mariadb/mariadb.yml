# THIS IS ONLY MEANT FOR DEVELOPMENT USE
version: '3.8'

volumes:
  mariadb_data: # Compose will manage this automatically now

services:
  mariadb:
    image: mariadb:10.3
    ports:
      - "3306:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=rootmeow
      - MARIADB_DATABASE=forum
      - MARIADB_USER=testuser
      - MARIADB_PASSWORD=meow
    volumes:
      - mariadb_data:/var/lib/mysql
      # This automatically runs your SQL scripts on first boot!
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootmeow"]
      interval: 10s
      timeout: 5s
      retries: 5
